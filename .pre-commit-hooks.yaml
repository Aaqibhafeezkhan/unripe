- id: unripe
  name: unripe
  description: Fail when a locked dependency version was published more recently than you trust
  entry: unripe check
  language: python
  files: (^|/)(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|deno\.lock|uv\.lock|pylock\.([^./]+\.)?toml|poetry\.lock|Pipfile\.lock|Cargo\.lock|go\.mod|composer\.lock|Gemfile\.lock|packages\.lock\.json|(buildscript-|settings-)?gradle\.lockfile|gradle/dependency-locks/[^/]+\.lockfile|(requirements|constraints)[\w.-]*\.txt)$
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
- id: unripe-changed
  name: unripe (only what the commit adds)
  description: Like unripe, but only checks versions the commit adds to a lockfile
  entry: unripe check --since HEAD
  language: python
  files: (^|/)(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|deno\.lock|uv\.lock|pylock\.([^./]+\.)?toml|poetry\.lock|Pipfile\.lock|Cargo\.lock|go\.mod|composer\.lock|Gemfile\.lock|packages\.lock\.json|(buildscript-|settings-)?gradle\.lockfile|gradle/dependency-locks/[^/]+\.lockfile|(requirements|constraints)[\w.-]*\.txt)$
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
