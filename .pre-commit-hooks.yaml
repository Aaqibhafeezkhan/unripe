- id: unripe
  name: unripe
  description: Fail when a locked dependency version was published more recently than you trust
  entry: unripe check
  language: python
  files: (^|/)(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|uv\.lock|poetry\.lock|Pipfile\.lock|Cargo\.lock|go\.mod|composer\.lock|Gemfile\.lock|(requirements|constraints)[\w.-]*\.txt)$
  pass_filenames: true
  require_serial: true
  minimum_pre_commit_version: "3.0.0"
