[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "unripe"
version = "0.4.0"
description = "Fail the build when a locked dependency is younger than you trust. One check for npm, pnpm, yarn, bun, PyPI, Cargo, Go, Composer, RubyGems, NuGet and Gradle lockfiles."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tex" }]
keywords = ["supply-chain", "security", "lockfile", "dependencies", "cooldown", "ci", "npm", "pypi", "cargo", "go", "nuget", "gradle", "maven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
# no runtime dependencies, on purpose: a supply-chain check should not bring a supply chain
dependencies = []

[project.urls]
Homepage = "https://github.com/TexWoW/unripe"
Issues = "https://github.com/TexWoW/unripe/issues"

[project.scripts]
unripe = "unripe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.sdist]
exclude = ["PLAN.md", ".claude", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/unripe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
